name: build Android

# Secure Connect for Android: v2rayN.Android (Avalonia + ServiceLib) with the
# sing-box / Xray cores and hev-socks5-tunnel. Produces one APK per ABI.
#
# Signing: without secrets the APKs are signed with a throwaway debug key, so
# every run has a different signature and an installed copy cannot be updated
# in place. For updatable builds add these repository secrets:
#   ANDROID_KEYSTORE_BASE64  base64 of a .keystore / .jks file
#   ANDROID_KEYSTORE_PASS    store password
#   ANDROID_KEY_ALIAS        key alias
#   ANDROID_KEY_PASS         key password

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the APKs to this existing release tag (optional)'
        required: false
        type: string
  push:
    branches:
      - android
    paths:
      - 'v2rayN/v2rayN.Android/**'
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/Directory.Build.props'
      - 'v2rayN/Directory.Packages.props'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    name: build APK (arm64 + x64)
    runs-on: ubuntu-24.04
    env:
      PROJECT: v2rayN/v2rayN.Android/v2rayN.Android.csproj
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.1xx

    - name: Install the .NET Android workload
      run: dotnet workload install android

    - name: Native parts (cores, geo files, hev-socks5-tunnel)
      shell: bash
      run: |
        export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
        echo "NDK: $ANDROID_NDK_HOME"
        bash v2rayN/v2rayN.Android/natives/fetch-natives.sh

    - name: Android SDK packages
      shell: bash
      run: |
        dotnet build "$PROJECT" -t:InstallAndroidDependencies -f net10.0-android \
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:JavaSdkDirectory="$JAVA_HOME" \
          -p:AcceptAndroidSDKLicenses=True

    - name: Signing key
      id: signing
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/secureconnect.keystore"
          echo "keystore=$RUNNER_TEMP/secureconnect.keystore" >> "$GITHUB_OUTPUT"
        else
          echo "No signing secrets: debug-signed APKs (not updatable in place)."
        fi

    - name: Publish APKs
      shell: bash
      env:
        KEYSTORE: ${{ steps.signing.outputs.keystore }}
        ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
      run: |
        set -euo pipefail
        sign=()
        if [ -n "${KEYSTORE:-}" ]; then
          sign=(-p:AndroidSigningKeyStore="$KEYSTORE" -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
                -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASS -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASS)
        fi
        mkdir -p dist
        for rid in android-arm64 android-x64; do
          dotnet publish "$PROJECT" -c Release -f net10.0-android -r "$rid" \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:ApplicationVersion="$(( 7000000 + GITHUB_RUN_NUMBER ))" \
            "${sign[@]}" -o "out/$rid"
          apk=$(ls out/$rid/*-Signed.apk | head -n 1)
          cp "$apk" "dist/SecureConnect-$rid.apk"
        done
        (cd dist && sha256sum *.apk > SHA256SUMS-android.txt)
        ls -l dist

    - name: Upload APKs
      uses: actions/upload-artifact@v7
      with:
        name: SecureConnect-android
        path: dist/*
        if-no-files-found: error

    - name: Attach to release
      if: inputs.release_tag != ''
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${{ inputs.release_tag }}" dist/*.apk dist/SHA256SUMS-android.txt --clobber
